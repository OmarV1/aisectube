# Weekly content refresh. Pulls ONLY from the curated sources in pipeline/*.py, runs the same filters,
# and opens a pull request ("proposed update") listing what changed. Nothing goes live until it is merged.
name: Weekly content update

on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday 06:00 UTC
  workflow_dispatch: {}         # or run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot current catalog
        run: cp site/data/videos.json /tmp/videos_before.json

      - name: Refresh Hacker News mentions (first week of the month only)
        working-directory: pipeline
        run: |
          if [ "$(date +%d)" -le 7 ]; then
            python harvest.py && python enrich.py
          else
            echo "Skipping HN harvest this week"
          fi

      - name: Refresh curated channels, courses and playlists
        working-directory: pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "$(date +%d)" -le 7 ]; then
            echo "First week of the month: full refresh (re-reads every channel's history, ~30 min)"
            rm -f ../data/uploads_cache.json
            python channels.py
          else
            echo "Quick refresh: newest uploads per channel only (~2 min)"
            python channels.py --recent
          fi
          python courses.py
          python classify.py

      - name: Summarize changes
        id: summary
        run: python pipeline/diff_summary.py /tmp/videos_before.json site/data/videos.json > /tmp/summary.md

      - name: Open proposed update
        uses: peter-evans/create-pull-request@v6
        with:
          branch: weekly-update
          delete-branch: true
          commit-message: "Weekly content update"
          title: "Weekly content update (${{ github.run_id }})"
          body-path: /tmp/summary.md
          add-paths: |
            site/data/*
            data/*.json
